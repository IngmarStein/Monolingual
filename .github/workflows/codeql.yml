# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '41 19 * * 6'

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ (matrix.language == 'swift' && 'xcode-27') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write
    
    env:
      DEVELOPER_DIR: ${{ (matrix.language == 'swift' && '/Applications/Xcode_27.0.app/Contents/Developer') || '' }}

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'ruby', 'swift' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.2
      with:
        languages: ${{ matrix.language }}
        # Swift is compiled, so it is built below; javascript and ruby are analyzed from
        # source alone and need no build.
        build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # CodeQL instruments this step by way of a tracer injected through DYLD_INSERT_LIBRARIES. That
    # tracer relocates the platform binaries it spawns, thinning them with /usr/bin/lipo on the way,
    # and macOS 27's /usr/bin/sandbox-exec carries only arm64e slices, which lipo cannot thin to
    # arm64. The relocated copy therefore does not run, and evaluating Package.swift — which Xcode
    # does under sandbox-exec — ends in `posix_spawn error: Bad CPU type in executable (86)` and
    # aborts the build while it loads the package graph, leaving CodeQL without a database.
    # IDEPackageSupportDisableManifestSandbox is the SwiftPM default that keeps Xcode from running
    # manifest evaluation under the sandbox; passing it here confines that to this job.
    # Resolving the dependencies ahead of time, before the tracer is in place, does not avoid the
    # spawn: SwiftPM evaluates the manifests under the sandbox whether or not its cache is warm.
    #
    # CodeQL's autobuild builds `xcodebuild -target Monolingual`, and building a target directly
    # never resolves the package dependencies, so the Helper target fails with "no such module
    # 'ArgumentParser'". Build the scheme instead.
    - name: Build
      if: matrix.language == 'swift'
      run: |
        xcodebuild -project Monolingual.xcodeproj -scheme Monolingual \
          -destination 'platform=macOS' \
          -IDEPackageSupportDisableManifestSandbox=1 \
          CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_ENABLE_COMPILE_CACHE=NO \
          SWIFT_USE_INTEGRATED_DRIVER=NO \
          build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.2
      with:
        category: "/language:${{matrix.language}}"
