<fieldset class="theme-switch">
	<legend>Color scheme</legend>
	<label title="Light">
		<input type="radio" name="theme" value="light" aria-label="Light">
		<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
	</label>
	<label title="Dark">
		<input type="radio" name="theme" value="dark" aria-label="Dark">
		<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
	</label>
	<label title="Match the system setting">
		<input type="radio" name="theme" value="system" aria-label="System">
		<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>
	</label>
</fieldset>
