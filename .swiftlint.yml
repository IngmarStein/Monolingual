disabled_rules:
  - line_length
  - function_body_length
  - type_body_length
  - file_length
  - cyclomatic_complexity
  - function_parameter_count
opt_in_rules:
  - vertical_whitespace
identifier_name:
  min_length: 1
  max_length: 50
type_name:
  max_length: 70
force_cast: warning
force_try: warning
excluded:
  - .build
  # The build directory holds Xcode's derived data, including the checked out dependencies.
  - build
  # The release directory holds a copy of the app and a link to /Applications, and linting it
  # makes SwiftLint walk into everything that is installed.
  - release*
  - Pods
  - Externals
  - fastlane
  - vendor
